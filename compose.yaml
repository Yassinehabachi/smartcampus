services:
  db:
    image: postgres:15-alpine
    container_name: smartcampus-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smartcampus_db}
      POSTGRES_USER: ${POSTGRES_USER:-smartcampus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartcampus_local}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    image: smartcampus:1.0
    container_name: smartcampus-api
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8082:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-smartcampus_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-smartcampus}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    restart: on-failure

  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: smartcampus-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - api
    profiles: ["monitoring"]

  grafana:
    image: grafana/grafana:10.4.2
    container_name: smartcampus-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    profiles: ["monitoring"]

  registry:
    image: registry:2
    container_name: smartcampus-registry
    ports:
      - "5000:5000"
    profiles: ["cicd"]

  jenkins:
    build: ./jenkins
    container_name: smartcampus-jenkins-ci
    user: root
    environment:
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:-admin}
    ports:
      - "8085:8080"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - registry
    profiles: ["cicd"]

volumes:
  jenkins_home:
  postgres_data:
