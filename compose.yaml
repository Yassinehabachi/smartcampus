services:
  db:
    image: postgres:15-alpine
    container_name: smartcampus-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smartcampus_db}
      POSTGRES_USER: ${POSTGRES_USER:-smartcampus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    image: smartcampus:1.0
    container_name: smartcampus-api
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8082:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-smartcampus_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-smartcampus}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    restart: on-failure

volumes:
  postgres_data:
