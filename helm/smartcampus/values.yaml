replicaCount: 2

image:
  repository: smartcampus-api
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

postgresql:
  enabled: true
  dbName: smartcampus_db
  user: smartcampus
  password: smartcampus_password
  port: 5432

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi
