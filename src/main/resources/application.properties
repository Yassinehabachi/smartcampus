server.port=${PORT:8080}

# Datasource: in-memory H2 by default so `mvn spring-boot:run` / `java -jar` start with zero setup.
# Set SPRING_DATASOURCE_URL/USERNAME/PASSWORD (compose, k8s, helm do) to use PostgreSQL; the driver is auto-detected.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:smartcampus;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA / Hibernate settings
# NOTE: Do NOT set hibernate.dialect in Hibernate 6 / Spring Boot 3 - it is auto-detected
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Wait for database connection gracefully
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5

# Actuator / monitoring
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=smartcampus
