server.port=8080

# PostgreSQL Connection (uses environment variables from compose, with defaults)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://db:5432/smartcampus_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:smartcampus}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:smartcampus_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate settings
# NOTE: Do NOT set hibernate.dialect in Hibernate 6 / Spring Boot 3 - it is auto-detected
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Wait for database connection gracefully
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5